<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DashBoard - Promotions</title>
    <!-- ======= Styles ====== -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/promotions.css" />

    <!--============Icon Cdn==============-->

    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.0.0/css/line.css"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />

    <!--============Icon Cdn==============-->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/ionicons@7.2.1/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <!-- ============Preloader============ -->
    <div id="preloader_active">
      <div id="loading-center">
        <div id="loading-center-absolute">
          <div class="object" id="object_one"></div>
          <div class="object" id="object_two"></div>
          <div class="object" id="object_three"></div>
        </div>
      </div>
    </div>

    <div class="wrapper">
      <div class="container">
        <nav class="navigation">
          <ul>
            <li>
              <a href="#">
                <span class="icon">
                  <ion-icon name="storefront-outline"></ion-icon>
                </span>
                <span class="title">Niger.net</span>
              </a>
            </li>

            <li class="hovered">
              <a href="index.html">
                <span class="icon">
                  <ion-icon name="home-outline"></ion-icon>
                </span>
                <span class="title">Dashboard</span>
              </a>
            </li>

            <li>
              <a href="configuration.html">
                <span class="icon">
                  <ion-icon name="layers-outline"></ion-icon>
                </span>
                <span class="title">Configuration Accueil</span>
              </a>
            </li>

            <li>
              <a href="products.html">
                <span class="icon">
                  <ion-icon name="server-outline"></ion-icon>
                </span>
                <span class="title">Products</span>
              </a>
            </li>

            <li>
              <a href="orders.html">
                <span class="icon">
                  <ion-icon name="reorder-four-outline"></ion-icon>
                </span>
                <span class="title">Orders</span>
              </a>
            </li>

            <li>
              <a href="customers.html">
                <span class="icon">
                  <ion-icon name="people-outline"></ion-icon>
                </span>
                <span class="title">Customers</span>
              </a>
            </li>

            <li>
              <a href="analytics.html">
                <span class="icon">
                  <ion-icon name="analytics-outline"></ion-icon>
                </span>
                <span class="title">Analytics and Reporting</span>
              </a>
            </li>

            <li>
              <a href="messages.html">
                <span class="icon">
                  <ion-icon name="chatbubble-outline"></ion-icon>
                </span>
                <span class="title">Messages</span>
              </a>
            </li>

            <li>
              <a href="blogs.html">
                <span class="icon">
                  <ion-icon name="chatbubbles-outline"></ion-icon>
                </span>
                <span class="title">Blogs</span>
              </a>
            </li>

            <li>
              <a href="promotions.html">
                <span class="icon">
                  <ion-icon name="pricetag-outline"></ion-icon>
                </span>
                <span class="title">Promotions</span>
              </a>
            </li>

            <li>
              <a href="#">
                <span class="icon">
                  <ion-icon name="log-out-outline"></ion-icon>
                </span>
                <span class="title">Sign Out</span>
              </a>
            </li>
          </ul>
        </nav>
        <main class="main">
          <div class="topbar">
            <div class="toggle">
              <ion-icon name="menu-outline"></ion-icon>
            </div>

            <div class="search">
              <label>
                <input type="text" placeholder="Search here" />
                <ion-icon name="search-outline"></ion-icon>
              </label>
            </div>

            <div class="user">
              <img src="assets/images/me.jpg" alt="" />
            </div>
          </div>

          <div class="admin-dashboard">
            <h1>Promotions Actuelles</h1>

            <div class="table-actions">
              <input
                type="text"
                id="search"
                class="search"
                placeholder="Search promotions..."
              />
              <button id="open-modal">
                <i class="fas fa-plus"></i> Add New promotions
              </button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Réduction</th>
                  <th>Produits</th>
                  <th>Période</th>
                  <th>Statut</th>
                </tr>
              </thead>
              <tbody id="promotionsTable"></tbody>
            </table>
          </div>

          <div class="admin-dashboard">
            <h1>Codes Promo</h1>

            <div class="table-actions">
              <input
                type="text"
                id="search"
                class="search"
                placeholder="Search code promo..."
              />
              <button id="open-modal">
                <i class="fas fa-plus"></i> Add New code promo
              </button>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Réduction</th>
                  <th>Conditions</th>
                  <th>Expiration</th>
                  <th>Statut</th>
                </tr>
              </thead>
              <tbody id="promoCodesTable"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- =========== Scripts =========  -->
    <script src="js/base.js"></script>
    <script src="js/promotions.js"></script>

    <!-- ====== ionicons ======= -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
